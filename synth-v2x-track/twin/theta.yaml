# Twin parameter space theta for V2X-Real (synth research line, synth-docs/RESEARCH-AGENDA.md Section 5).
# Current values: the point estimate behind the R5/S6 corpus g1-v5 (data-v2x-track/prepare_g1.py --name g1-v4 --walkers 16
# --walker v2 --placement prior --fov-mask --density-gain 2.5 --g2, plus --density-prior gen/density_prior_v1.npz).
# Code defaults as of 2026-10-17 (release 6.0). Nothing here changes the detector line (data-*/model-*).
track: v2x-track
simulator: G1 walker insertion + engine G2-lite over the organizers' 10,000 UT-V2X frames (CARLA twin), one OS1-64 (64 x 1024)
build_cost: 10,000 frames in about 1.6 min on 96 workers (logs/r5, 2026-10-14)

parameters:
  # ---- sensor and insertion
  walker_drop:        {group: sensor,  hook: "pedsim.InsertParams.drop_prob",    current: 0.02,  prior: [0.0, 0.15]}
  walker_range_noise: {group: sensor,  hook: "pedsim.InsertParams.range_noise",  current: 0.02,  prior: [0.005, 0.06], unit: m}
  block_margin:       {group: sensor,  hook: "pedsim.InsertParams.block_margin", current: 0.25,  prior: [0.10, 0.50], unit: m}
  occlude_eps:        {group: sensor,  hook: "pedsim.InsertParams.occlude_eps",  current: 0.05,  prior: [0.02, 0.15], unit: m}
  drop_clutter:       {group: sensor,  hook: "prepare_g1.DROP.clutter",          current: 0.10,  prior: [0.0, 0.4]}
  null_fraction:      {group: sensor,  hook: "track.yaml resample.null_fraction (bdc26.frames.with_nulls)", current: 0.309, prior: [0.25, 0.37], note: measured on the kit's test frames (format only); range-dependent profile is a WP1 extension}
  density_gain:       {group: sensor,  hook: "prepare_g1 --density-gain",        current: 2.5,   prior: [1.0, 4.0]}
  # ---- content
  walkers_mean:       {group: content, hook: "prepare_g1 --walkers",             current: 16.0,  prior: [6.0, 30.0]}
  walker_depth_lo:    {group: content, hook: "WALKERS.v2.style.depth_range[0]",  current: 1.25,  prior: [1.0, 1.5]}
  walker_depth_hi:    {group: content, hook: "WALKERS.v2.style.depth_range[1]",  current: 1.70,  prior: [1.5, 2.0]}
  walker_arm_swing:   {group: content, hook: "WALKERS.v2.style.arm_swing",       current: 1.3,   prior: [0.5, 2.0]}
  backpack_prob:      {group: content, hook: "WALKERS.v2.style.backpack_prob",   current: 0.30,  prior: [0.0, 0.6]}
  sidebag_prob:       {group: content, hook: "WALKERS.v2.style.sidebag_prob",    current: 0.25,  prior: [0.0, 0.5]}
  body_yaw_sigma:     {group: content, hook: "WALKERS.v2.body_yaw_sigma",        current: 0.8,   prior: [0.0, 1.5], unit: rad}
  clutter_mean:       {group: content, hook: "prepare_g1 --clutter",             current: 30.0,  prior: [0.0, 80.0]}
  clutter_anchor_share: {group: content, hook: "G2Config.anchor_share",          current: 0.6,   prior: [0.2, 0.9]}
  clutter_mix:        {group: content, hook: "g2.CLUTTER_KINDS", current: {pole: 0.35, tree: 0.20, bollard: 0.15, utility_box: 0.15, bin: 0.10, barrier: 0.05},
                       prior: {dirichlet_concentration: 20, centred_on: current}}
  truck_stretch_prob: {group: content, hook: "prepare_g1 --truck-size",          current: 0.0,   prior: [0.0, 0.5]}
  # ---- placement
  placement_mode:     {group: placement, hook: "prepare_g1 --placement",         current: prior, prior: {choice: [free, prior]}}
  # ---- background
  prior_strength:     {group: background, hook: "density ratio exponent applied to gen/density_prior_v1.npz", current: 1.0, prior: [0.0, 1.5], note: new hook (WP1)}

# Not inferred (fixed): the OS1-64 beam table and pose, the organizers' UT frames, the super-class map, the FOV mask,
# the 50,000-point protocol. Dimension: 18 scalars (sensor 7, content 10, background 1) + a 6-way mix + one binary choice.

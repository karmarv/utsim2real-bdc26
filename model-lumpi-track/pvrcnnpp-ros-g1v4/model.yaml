name: pvrcnnpp-ros-g1v4
strategy: R3
track: lumpi-track
module: M9 (engine G2-lite)
derived_from: pvrcnnpp-ros-g1v3
framework: OpenPCDet 0.6.0 (233f849), BDCDataset adapter (common/bdc26/detect/pcdet_dataset.py)
architecture: PV-RCNN++ (as pvrcnnpp-ros-g1v3) with generic ROS

status: 'R3: trained 40 epochs (ROS capped), tuned plain and TTA (0.342 / 0.191);
  Person, Bicycle and Motorcycle pass; Bicycle and Truck fusions of routed-g6'
expected: Car, Bicycle and Truck fusion member above pvrcnnpp-ros-g1v3
notes: 'R3 (docs/02-STRATEGY.md Section 8.7.1): trained on pcdet/g1-v4 = the g1-v3
  recipe plus engine G2-lite (actors re-cast at real size and density, real-sized
  trucks, buses and two-wheelers with riders, unlabeled static clutter as hard negatives).
  The ROS ranges keep only the generic jitter (and the V2X truck width/height range)
  because the corpus now has real label sizes: the S5 Bicycle and Truck length ranges
  would scale real-sized objects a second time.


    - ppros6d2_tta
    - dsrosf6_tta12
    - pvros6j_tta12
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
  Motorcycle:
    members:
    - vnrosn6_tta12
    - vnrosf6d2_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Truck:

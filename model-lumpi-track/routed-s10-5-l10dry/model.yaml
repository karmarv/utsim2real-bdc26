status: 'S10-5 L10dry: routed-s10-5-l9 plus dry6:voxelrcnn-rosf-g1v6jn1 (extend, fuse,
  rare classes frozen, final check; docs/decisions/2026-11-14-s10-10.5-final-push.md
  Section 10)'
notes: 'S10-5 L10dry (record Section 10): the architecture arm; rules fixed before
  results.

  '
budget:
  Person: 0.01
  Bicycle: 0.01
  Motorcycle: 0.01
  Bus: 0.01
  Truck: 0.01
  Van: 0.01
  Unknown: 0.075
tail_copies:
  Bus:
    r: 1.0
    n: 4
  Person:
    r: 0.2
    n: 4
    min_score: 0.7531
route:
  Person: vrrosn6_tta12
  Car: vrrosf6_tta12
  Bicycle: bppros6x_tta
  Motorcycle: vnrosn6_tta12
  Bus: ppros6_tta
  Truck: bpvros6x_tta
  Van: dsrosf6_tta12
  Unknown: pprosf6_tta
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); also a gain on the pooled A+B frames (P(gain) >=
    0.9)'
  estimate_mAP_A: 0.3995
  estimate_mAP_B: 0.2273
fusion:
  Person:
    members:
    - vrrosn6_tta12
    - bvrrosf6x_tta12
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Car:
    members:
    - vrrosf6_tta12
    - bvrrosn6x_tta
    - vrrosf6j_tta12
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Bicycle:

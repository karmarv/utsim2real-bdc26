data:
  train: pcdet/g1-v2
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v4
status: 'S8 U2, the LUMPI entry until S8.2 (1022399) and its fallback (release 8.0):
  submitted 1022250, combined 0.523901 (mAP 0.1762), rank 1 of 22 (2026-10-30); +0.00106
  over 1014495 (Person +0.0063, Truck +0.0021, Motorcycle +0.0003); the S7.6 entry
  with the non-negative completion and Person fused from 12-view members (docs/decisions/2026-10-29-s8-last-day-strategy.md)'
notes: 'S8 U2 (docs/decisions/2026-10-29-s8-last-day-strategy.md, rules 3, 4 and 8).

  '
route:
  Person: ppros4_tta
  Car: pv_tta
  Bicycle: vrros_tta
  Motorcycle: g1v3
  Bus: pp4_tta
  Truck: pvros4d2_tta
  Van: g1
  Unknown: g1
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); members compared with their gated z calibration;
    also a gain on the pooled A+B frames (P(gain) >= 0.9)'
  estimate_mAP_A: 0.3528
  estimate_mAP_B: 0.2096
calibration: null
fusion:
  Bicycle:
    members:
    - vrros_tta
    - pvros4_tta
    - pp4_tta
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Bus:
    members:
    - ppros4_tta
    - vrros_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.3
    calibration: {}
  Person:

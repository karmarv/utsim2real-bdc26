data:
  train: pcdet/g1-v2
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v4
status: 'R5: decision-ready (A 0.377 / B 0.223, estimate 0.565, below the upload gate;
  Person-only change); package submissions/2026-10-14_r5'
notes: 'R3 Engine G2-lite (docs/02-STRATEGY.md Section 8.7.1): the confirmed S4 portfolio
  routed-g4 (route, fusion and score floors are the incumbents) plus the S5 members
  and the R3 g1-v4 members; every change, the S5 ones included, passes the class gate
  with the pooled A+B condition.

  '
route:
  Person: ppros4_tta
  Car: pv_tta
  Bicycle: vrros_tta
  Motorcycle: g1v3
  Bus: pp4_tta
  Truck: g1v3_tta
  Van: g1
  Unknown: g1
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); members compared with their gated z calibration;
    also a gain on the pooled A+B frames (P(gain) >= 0.9)'
  estimate_mAP_A: 0.3208
  estimate_mAP_B: 0.2063
calibration: {}
fusion:
  Person:
    members:
    - pp4_tta
    - vrros4s2_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
  Car:
    members:
    - g1v3_tta
    - cp_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Bicycle:
    members:
    - vrros_tta
    - pvros4_tta
    - pp4_tta
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Bus:
    members:
    - ppros4_tta
    - vrros_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.3
    calibration: {}
  Truck:
    members:
    - pvros_tta
    - ppros_tta
    - pvros4_tta
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.3
    calibration: {}
budget:
  Person: 0.01
  Car: 0.02
  Bicycle: 0.02
  Motorcycle: 0.3
  Bus: 0.075
  Truck: 0.03
  Van: 0.075
  Unknown: 0.075

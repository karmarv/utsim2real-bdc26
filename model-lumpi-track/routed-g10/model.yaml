data:
  train: pcdet/g1-v2
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v4
status: 'S7.6, the LUMPI entry until S8 (1022250, release 8.0) and the F1 fallback: submitted 1014495, combined 0.522846 (mAP 0.1749),
  rank 1 of 22 (2026-10-27); routed-g9 before its final-check freeze, the extended bags
  swapped into the incumbent fusions, the pooled budget (docs/decisions/2026-10-26-s7-final-revisions.md)'
notes: 'S7.6 amendment (docs/decisions/2026-10-26-s7-final-revisions.md).

  '
route:
  Person: ppros4_tta
  Car: pv_tta
  Bicycle: vrros_tta
  Motorcycle: g1v3
  Bus: pp4_tta
  Truck: pvros4d2_tta
  Van: g1
  Unknown: g1
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); members compared with their gated z calibration;
    also a gain on the pooled A+B frames (P(gain) >= 0.9)'
  estimate_mAP_A: 0.3528
  estimate_mAP_B: 0.2096
calibration: null
fusion:
  Car:
    members:

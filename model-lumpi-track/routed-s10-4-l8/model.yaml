data:
  train: pcdet/g1-v6
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v6
status: 'S10-4 L8: routed-s10-2-l5 (L5, 1051465) unchanged plus two parts appended
  to its final_adjust (docs/decisions/2026-11-14-s10-10.4-plan.md)'
notes: 'S10-4 L8 (docs/decisions/2026-11-14-s10-10.4-plan.md): L5''s members, route,
  fusion, budget, copies, size calibration and P unchanged; appended to final_adjust:
  Car l and w 25% of the way to the train-split median (4.48 x 1.99 m, Measurement4
  frames 0-6495, as P''s targets), and cross-class copies (every Motorcycle box also
  as a Bicycle at the Bicycle median size, every Truck box also as a Bus), each scored
  below every box of its new class, so those classes'' AP cannot fall. Chosen on L5''s
  realval outputs (val, valB, late-A).

  '
budget:
  Person: 0.01
  Bicycle: 0.01
  Motorcycle: 0.01
  Bus: 0.01
  Truck: 0.01
  Van: 0.01
  Unknown: 0.075
tail_copies:
  Bus:
    r: 1.0
    n: 4
  Person:
    r: 0.2
    n: 4
    min_score: 0.7531
route:
  Person: vrrosn6_tta12
  Car: vrrosf6_tta12
  Bicycle: bppros6x_tta
  Motorcycle: vnrosn6_tta12
  Bus: ppros6_tta
  Truck: bpvros6x_tta
  Van: dsrosf6_tta12
  Unknown: pprosf6_tta
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); also a gain on the pooled A+B frames (P(gain) >=
    0.9)'
  estimate_mAP_A: 0.3995
  estimate_mAP_B: 0.2273
fusion:
  Person:
    members:
    - vrrosn6_tta12
    - bvrrosf6x_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Car:
    members:
    - vrrosf6_tta12
    - bvrrosn6x_tta
    - vrrosf6j_tta12
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Bicycle:
    members:
    - ppros6d2_tta
    - dsrosf6_tta12
    - pvros6j_tta12
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
  Motorcycle:
    members:
    - vnrosn6_tta12
    - vnrosf6d2_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  Truck:
    members:
    - bpvros6x_tta
    - pvros6j_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
calibration: {}
size_calibration:
  anchors:
  - - -9.55438795260801
    - 16.298578446378514
  - - 7.718669570567556
    - -13.649307377132999
  - - -19.382036958547815
    - -1.4609732941645177
  - - 18.994734146224232
    - 13.52992077031405
  - - -13.450910870091832
    - -21.504620464347724
  classes:
    Car:
      dl: -0.2
      dw: 0.08
      dh: 0.07
    Person:
      dh: 0.03
final_adjust:
  size:
    Person:
      target:
      - 0.76
      - 0.74
      - 1.9
      alpha_h: 0.5
    Bicycle:
      target:
      - 2.0
      - 0.85
      - 1.9
      alpha_lw: 0.25
    Car:
      target:
      - 4.48
      - 1.99
      - 1.7
      alpha_lw: 0.25
  copies:
    Person:
      r: 0.2
      n: 4
      lw_scale: 1.1
      min_score: 0.3
  cross_copies:
    Bicycle:
      from: Motorcycle
      target:
      - 2.0
      - 0.85
      - 1.9
    Bus:
      from: Truck

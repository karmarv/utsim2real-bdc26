status: 'R3 wave 0: trained 40 epochs, tuned plain (A 0.289 / B 0.183) and TTA (0.317
  / 0.195); Bicycle and Bus pass against pointpillars-g1v3, Truck loses (long anchor
  at a static structure)'
expected: Person and Motorcycle (the pointpillars-g1v3 routes) above pointpillars-g1v3
  on realval-B and pooled; fewer static walker false positives
notes: 'R3 (docs/02-STRATEGY.md Section 8.7.1): trained on pcdet/g1-v4 = the g1-v3
  recipe plus engine G2-lite (actors re-cast at real size and density, real-sized
  trucks, buses and two-wheelers with riders, unlabeled static clutter as hard negatives).
  Data-only ablation against pointpillars-g1v3 (same detector; anchors follow the
  new label sizes).


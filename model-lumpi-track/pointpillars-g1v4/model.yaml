name: pointpillars-g1v4
strategy: R3
track: lumpi-track
module: M9 (engine G2-lite)
derived_from: pointpillars-g1v3
framework: OpenPCDet 0.6.0 (233f849), BDCDataset adapter (common/bdc26/detect/pcdet_dataset.py)
architecture: PointPillars (as pointpillars-g1v3), anchors at the g1-v4 label medians
data:

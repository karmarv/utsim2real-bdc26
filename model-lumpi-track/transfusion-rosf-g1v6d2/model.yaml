name: transfusion-rosf-g1v6d2
strategy: S10-5
track: lumpi-track
module: release 10.5, the detection-architecture arm (docs/decisions/2026-11-14-s10-10.5-final-push.md
  Section 10)
derived_from: transfusion-rosf-g1v6
framework: OpenPCDet 0.6.0 (233f849) with common/patches/openpcdet_transfusion_novel.patch,
  BDCDataset adapter (common/bdc26/detect/pcdet_dataset.py)
architecture: TransFusion-L (Bai et al., CVPR 2022) - VoxelResBackBone8x and the BEV
  backbone of voxelrcnn-rosf-g1v6, with the transformer query head (class-aware heat-map
  query initialisation, 200 queries, Hungarian matching, one decoder layer) in place
  of the CenterHead + RoI head; same data config (ROS, GT-sampling fade, tilt)
data:
  train: pcdet/g1-v6d2
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v6
postprocess: test/postprocess.yaml
status: 'planned (release 10.5 architecture arm: the second generator draw, training
  seed 2234, 4 GPUs; starts when transfusion-rosf-g1v6 has trained)'
expected: a fusion member whose errors are decorrelated from the CenterHead families
  (one query set shared by all classes, matched jointly); Person, Bicycle and Car
  are where fusion can use it
notes: 'Release 10.5 architecture arm (record Section 10): transfusion-rosf-g1v6''s
  config on the second generator draw pcdet/g1-v6d2 (seed 2234), its draw-bag partner,
  as voxelrcnn-rosf-g1v6d2 is for voxelrcnn-rosf-g1v6. Frames stay g1-v6.

  '

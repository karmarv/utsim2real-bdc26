name: routed-g5
strategy: S5
track: lumpi-track
module: M11 (TTA and fusion) with two-stage members
framework: members' OpenPCDet checkpoints, each with its own test/postprocess.yaml
architecture: per-class routing and box fusion (up to 3 members) of PointPillars,
  CenterPoint and two-stage members, including the S5 GBlobs and object-scaling Voxel
  R-CNN runs, with test-time augmentation
members:
  g1:
    model: pointpillars-g1
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  g1_tta:
    model: pointpillars-g1
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  g1v3:
    model: pointpillars-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  g1v3_tta:
    model: pointpillars-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  cp:
    model: centerpoint-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  cp_tta:
    model: centerpoint-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  cp4:
    model: centerpoint-s4-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  cp4_tta:
    model: centerpoint-s4-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  vr:
    model: voxelrcnn-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  vr_tta:
    model: voxelrcnn-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  pv:
    model: pvrcnnpp-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  pv_tta:
    model: pvrcnnpp-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  vrgb:
    model: voxelrcnn-gblobs-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  vrgb_tta:
    model: voxelrcnn-gblobs-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  vrros:
    model: voxelrcnn-ros-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  vrros_tta:
    model: voxelrcnn-ros-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  pvros:
    model: pvrcnnpp-ros-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  pvros_tta:

name: routed-s10-5-v5
strategy: S10-5
track: v2x-track
module: M11 (TTA and fusion) with two-stage members
framework: members' OpenPCDet checkpoints, each with its own test/postprocess.yaml
architecture: 'per-class routing and box fusion (up to 3 members) of clean members
  only (S10 rule 1: corpora without real label rows, the g1-v6 family and UrbanTwin),
  with test-time augmentation'

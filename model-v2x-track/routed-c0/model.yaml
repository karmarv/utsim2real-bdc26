data:
  train: pcdet/g1-v6
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v6
status: S10 clean portfolio routed-c0 (docs/decisions/2026-11-08-s10-clean-final-plan.md)
notes: 'S10 (docs/decisions/2026-11-08-s10-clean-final-plan.md, Sections 7-8): built
  from scratch on clean members.

  '
route:
  vehicle: bvrros6x_tta12
  pedestrian: bvrros6x_tta12
  truck: vrrosf6_tta12
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); also a gain on the pooled A+B frames (P(gain) >=
    0.9)'
  estimate_mAP_A: 0.6967
  estimate_mAP_B: 0.6896
fusion:
  vehicle:
    members:
    - bvrros6x_tta12
    - dsros6_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
  pedestrian:
    members:
    - vrros6d2_tta12
    - vrros6_tta12
    - vrrosf6_tta12
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
  truck:
    members:
    - vrrosf6_tta12
    - bvrros6x_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
budget:
  vehicle: 0.01
  pedestrian: 0.05
  truck: 0.05
tail_copies:
  pedestrian:
    r: 0.15
    n: 4
sparse_demotion:
  vehicle: 6
  pedestrian: 6
  truck: 8
size_calibration:
  anchors:
  - - 0.0
    - 0.0
  classes:
    vehicle:
      dl: -0.3
      dh: 0.03

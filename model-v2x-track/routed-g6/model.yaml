data:
  train: pcdet/g1-v3
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v4
status: 'R3 submitted 2026-10-13 (scored 2026-10-14 UTC): 986496 combined 0.8789 (mAP
  0.5929, R 0.9268), rank 1 of 19, confirmed; realval-A 0.701, realval-B 0.703, estimate
  (B, unclipped) 0.973'
notes: 'R3 Engine G2-lite (docs/02-STRATEGY.md Section 8.7.1): the confirmed S5 portfolio
  routed-g5 (route, fusion and score floors are the incumbents) plus the R3 g1-v4
  members; every change passes the class gate with the pooled A+B condition.

  '
route:
  vehicle: pv_tta
  pedestrian: vrros_tta
  truck: ut_tta
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); members compared with their gated z calibration;
    also a gain on the pooled A+B frames (P(gain) >= 0.9)'
  estimate_mAP_A: 0.6697
  estimate_mAP_B: 0.6706
calibration:
  truck:
    z0: 0.0
    z_per_m: 0.0075
fusion:
  vehicle:
    members:
    - vrgb_tta
    - pv_tta
    - pvros_tta
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  pedestrian:
    members:
    - vrros_tta
    - vrros4_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
  truck:
    members:
    - ut_tta
    - vrros_tta
    - pvros_tta
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.5
    calibration:
      ut_tta:
        z0: 0.0
        z_per_m: 0.0075
budget:
  vehicle: 0.01
  pedestrian: 0.1
  truck: 0.1

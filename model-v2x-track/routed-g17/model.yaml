data:
  train: pcdet/g1-v3
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v6
status: 'S9: routed-g15 plus the engine-v6 members that passed rule 3 (dsvt6:dsvt-ros-g1v6
  bvn6:bag-voxelnext-ros-g1v6x vn6:voxelnext-ros-g1v6 vrrosf6:voxelrcnn-rosf-g1v6),
  rule 4 of S8.2 in full (extend, fuse up to 3), gated per class (docs/decisions/2026-11-02-s9-clean-twin-plan.md)'
notes: 'S9 (docs/decisions/2026-11-02-s9-clean-twin-plan.md, Sections 7-8).

  '
route:
  vehicle: pv_tta
  pedestrian: vrros_tta
  truck: ut_tta
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); members compared with their gated z calibration;
    also a gain on the pooled A+B frames (P(gain) >= 0.9)'
  estimate_mAP_A: 0.7075
  estimate_mAP_B: 0.7044
calibration:
  truck:
    z0: 0.0
    z_per_m: 0.0075
fusion:
  pedestrian:
    members:
    - bagvr5_tta
    - bagpv5x_tta
    - vrros_tta12
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  vehicle:
    members:
    - bagvr5_tta
    - pvros4s2_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration:
      pvros4s2_tta:
        z0: -0.075
        z_per_m: 0.005
  truck:
    members:
    - pp5_tta
    - bagvr5_tta
    - bagpv5
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
budget:
  vehicle: 0.01
  pedestrian: 0.02
  truck: 0.075
tail_copies:
  pedestrian:
    r: 0.15
    n: 4
sparse_demotion:
  vehicle: 5
  pedestrian: 6

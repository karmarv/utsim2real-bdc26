# Model card (machine-readable). Documentation: ./README.md and model-v2x-track/README.md.
# A routed model trains nothing itself: each class comes from one member (common/tools/route_predictions.py).
name: routed-g1
track: v2x-track
module: M11 (per-class routing)
framework: members' OpenPCDet checkpoints, each with its own test/postprocess.yaml
architecture: per-class routing of PointPillars G1 models
members:
  ut: {model: pointpillars-ut, ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth}
  g1: {model: pointpillars-g1, ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth}
  g1v2: {model: pointpillars-g1v2, ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth}
  g1v3: {model: pointpillars-g1v3, ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth}
data:
  train: pcdet/g1-v3          # members' corpora: ut-v1, g1-v1, g1-v2, g1-v3
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v3
status: "selected; first submission packaged 2026-10-02 (submissions/2026-10-02_first)"
notes: >
  Route chosen on real validation (see route_selection): vehicle from g1v2, pedestrian from g1v3 (walkers calibrated on legal real
  walkers, FOV mask), truck from the UT-only baseline. Realism frames from g1-v3 (FOV-masked, the corpus of the pedestrian member).
route:
  vehicle: g1v2
  pedestrian: g1v3
  truck: ut
route_selection:
  rule: best realval-A AP; within 0.005 of the best, the higher realval-B AP
  estimate_mAP_A: 0.5718
  estimate_mAP_B: 0.5204

name: routed-g4
strategy: S4
track: v2x-track
module: M11 (TTA and fusion) with two-stage members
framework: members' OpenPCDet checkpoints, each with its own test/postprocess.yaml
architecture: per-class routing and box fusion (up to 3 members) of PointPillars,
  CenterPoint and two-stage (Voxel R-CNN, PV-RCNN++) members, with test-time augmentation
members:
  ut:
    model: pointpillars-ut
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  ut_tta:
    model: pointpillars-ut
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  g1:
    model: pointpillars-g1
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  g1_tta:
    model: pointpillars-g1
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  g1v2:
    model: pointpillars-g1v2
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  g1v2_tta:
    model: pointpillars-g1v2
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  g1v3:
    model: pointpillars-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  g1v3_tta:
    model: pointpillars-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  cp:
    model: centerpoint-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  cp_tta:
    model: centerpoint-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  cp4:
    model: centerpoint-s4-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  cp4_tta:
    model: centerpoint-s4-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  vr:
    model: voxelrcnn-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  vr_tta:
    model: voxelrcnn-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  pv:
    model: pvrcnnpp-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  pv_tta:
    model: pvrcnnpp-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
data:
  train: pcdet/g1-v3
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v3
status: 'S4 submitted 2026-10-11: 975938 combined 0.8485 (mAP 0.5605); superseded
  by routed-g5 (978945)'
notes: 'S4 Two-Stage Refinement (docs/02-STRATEGY.md Section 8.4): the routed-g3 portfolio
  (its route, fusion and score floors are the incumbents) plus the two-stage members
  voxelrcnn-g1v3 and pvrcnnpp-g1v3 and their TTA variants; every change passes the
  class gate against the S3 choice.

  '
route:
  vehicle: pv_tta
  pedestrian: pv_tta
  truck: ut_tta
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); members compared with their gated z calibration'
  estimate_mAP_A: 0.6592
  estimate_mAP_B: 0.6644
calibration:
  truck:
    z0: 0.0
    z_per_m: 0.0075
fusion:
  vehicle:
    members:
    - pv_tta
    - vr_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  pedestrian:
    members:
    - g1v3_tta
    - cp4_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.5
    calibration:
      g1v3_tta:
        z0: -0.225
        z_per_m: 0.0075
  truck:
    members:
    - g1v3_tta
    - g1v2_tta
    - vr_tta
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.7
    calibration:
      g1v3_tta:
        z0: 0.05
        z_per_m: 0.005
budget:
  vehicle: 0.01
  pedestrian: 0.075
  truck: 0.1

name: routed-g3
strategy: S3
track: v2x-track
module: M11 (TTA and fusion)
framework: members' OpenPCDet checkpoints, each with its own test/postprocess.yaml
architecture: per-class routing and box fusion of PointPillars and CenterPoint members,
  with test-time augmentation
members:
  ut:
    model: pointpillars-ut
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  ut_tta:
    model: pointpillars-ut
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  g1:
    model: pointpillars-g1
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  g1_tta:
    model: pointpillars-g1
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  g1v2:
    model: pointpillars-g1v2
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  g1v2_tta:
    model: pointpillars-g1v2
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  g1v3:
    model: pointpillars-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  g1v3_tta:
    model: pointpillars-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  cp:
    model: centerpoint-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  cp_tta:
    model: centerpoint-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
  cp4:
    model: centerpoint-s4-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
  cp4_tta:
    model: centerpoint-s4-g1v3
    ckpt: train/output/pcdet_model/run1/ckpt/checkpoint_epoch_40.pth
    tta: flip4+yaw+z
    postprocess: test/postprocess_tta.yaml
data:
  train: pcdet/g1-v3
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v3
status: 'S3 submitted 2026-10-10: 974400 combined 0.8381 (mAP 0.5483, R 0.9203), rank
  1 of 19; realval-A 0.661, realval-B 0.664, estimate (B) 0.937'
notes: 'S3 Fused Portfolio with TTA (docs/02-STRATEGY.md Section 8.3.1): the members
  of routed-g2 and their 8-view TTA variants (<member>_tta, tune_and_eval.sh --tta);
  route by select --rule joint --calibrated, per-class fusion of two checkpoints by
  fuse, per-class score floors by budget; every choice passed the class gate.

  '
route:
  vehicle: cp_tta
  pedestrian: g1v3_tta
  truck: ut_tta
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); members compared with their gated z calibration'
  estimate_mAP_A: 0.635
  estimate_mAP_B: 0.6165
calibration:
  pedestrian:
    z0: -0.225
    z_per_m: 0.0075
  truck:
    z0: 0.0
    z_per_m: 0.0075
fusion:
  vehicle:
    members:
    - cp_tta
    - g1v2_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
  pedestrian:
    members:
    - g1v3_tta
    - cp4_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.5
    calibration:
      g1v3_tta:
        z0: -0.225
        z_per_m: 0.0075
  truck:
    members:
    - ut_tta
    - g1v2_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.5
    calibration:
      ut_tta:
        z0: 0.0
        z_per_m: 0.0075
budget:
  vehicle: 0.05
  pedestrian: 0.075
  truck: 0.2

data:
  train: pcdet/g1-v3
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v3
status: 'S5 submitted 2026-10-11: 978945 combined 0.8730 (mAP 0.5890, R 0.9203), rank
  1 of 19; realval-A 0.694, realval-B 0.699, estimate (B) 0.967; superseded as the
  entry by R3 (986496, 0.8789) on 2026-10-14'
notes: 'S5 Geometry-Invariant Inputs (docs/02-STRATEGY.md Section 8.5): the routed-g4
  portfolio (route, fusion and score floors are the incumbents) plus the kept S5 runs
  as plain and TTA members; every change passes the class gate against the S4 choice.

  '
route:
  vehicle: pv_tta
  pedestrian: vrros_tta
  truck: ut_tta
route_selection:
  rule: 'joint: rank members by the mean of realval-A and realval-B AP; a class leaves
    its current member only through the class gate (dB >= 0.01, paired bootstrap x200
    P(gain) >= 0.9, dA >= -0.005); members compared with their gated z calibration'
  estimate_mAP_A: 0.6697
  estimate_mAP_B: 0.6706
calibration:
  truck:
    z0: 0.0
    z_per_m: 0.0075
fusion:
  vehicle:
    members:
    - vrgb_tta
    - pv_tta
    - pvros_tta
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.7
    calibration: {}
  pedestrian:
    members:
    - vrros_tta
    - pv_tta
    weights:
    - 1.0
    - 1.0
    iou: 0.5
    calibration: {}
  truck:
    members:
    - ut_tta
    - vrros_tta
    - pvros_tta
    weights:
    - 1.0
    - 1.0
    - 1.0
    iou: 0.5
    calibration:
      ut_tta:
        z0: 0.0
        z_per_m: 0.0075
budget:
  vehicle: 0.01
  pedestrian: 0.1
  truck: 0.1

name: pvrcnnpp-ros-g1v4
strategy: R3
track: v2x-track
module: M9 (engine G2-lite)
derived_from: pvrcnnpp-ros-g1v3
framework: OpenPCDet 0.6.0 (233f849), BDCDataset adapter (common/bdc26/detect/pcdet_dataset.py)
architecture: PV-RCNN++ (as pvrcnnpp-ros-g1v3) with ROS (truck length range removed)
data:
  train: pcdet/g1-v4
  realval: pcdet/realval-v1
realism_frames: pcdet/g1-v3
postprocess: test/postprocess.yaml
status: 'R3: trained 40 epochs (ROS capped), tuned plain (0.632 / 0.633) and TTA (0.663
  / 0.666); every class passes plain, pedestrian and truck TTA'
expected: vehicle and truck fusion member above pvrcnnpp-ros-g1v3
notes: 'R3 (docs/02-STRATEGY.md Section 8.7.1): trained on pcdet/g1-v4 = the g1-v3
  recipe plus engine G2-lite (actors re-cast at real size and density, real-sized
  trucks, buses and two-wheelers with riders, unlabeled static clutter as hard negatives).
  The ROS ranges keep only the generic jitter (and the V2X truck width/height range)
  because the corpus now has real label sizes: the S5 Bicycle and Truck length ranges
  would scale real-sized objects a second time.

  '
